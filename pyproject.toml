[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mistwan-performance"
version = "26.01.26"
description = "Retail WAN Performance, Path Stability & Quality Visibility from Mist APIs"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.13"
authors = [
    {name = "HPE Network Operations"}
]
keywords = ["mist", "wan", "performance", "monitoring", "snowflake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "mistapi>=0.50.0",
    "snowflake-connector-python>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "colorlog>=6.7.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.scripts]
mistwan = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "data"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dash exposes dash_table components dynamically at runtime.
module = "dash.dash_table"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff.lint.per-file-ignores]
# Each worker, cache call, and Dash callback logs any failure and keeps the dashboard and the refresh loops running, as the code did before the gates.
"run_dashboard.py" = ["BLE001"]
"src/aggregators/time_aggregator.py" = ["BLE001"]
"src/api/async_mist_client.py" = ["BLE001"]
"src/api/mist_client.py" = ["BLE001"]
"src/cache/async_precompute.py" = ["BLE001"]
"src/cache/background_refresh.py" = ["BLE001"]
"src/cache/dashboard_precompute.py" = ["BLE001"]
"src/cache/redis_cache.py" = ["BLE001"]
"src/cache/site_precompute.py" = ["BLE001"]
"src/calculators/kpi_calculator.py" = ["BLE001"]
"src/collectors/quality_collector.py" = ["BLE001"]
"src/collectors/sle_collector.py" = ["BLE001"]
"src/collectors/status_collector.py" = ["BLE001"]
"src/collectors/utilization_collector.py" = ["BLE001"]
"src/dashboard/app.py" = ["BLE001"]
"src/dashboard/data_provider.py" = ["BLE001"]
"src/dashboard/pages/detail_data.py" = ["BLE001"]
"src/loaders/snowflake_loader.py" = ["BLE001"]
"src/main.py" = ["BLE001"]
