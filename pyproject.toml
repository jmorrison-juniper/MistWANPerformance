[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "mistwan-performance"
version = "26.10.05.02.10"
description = "Retail WAN Performance, Path Stability & Quality Visibility from Mist APIs"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.13"
authors = [
    {name = "HPE Network Operations"}
]
keywords = ["mist", "wan", "performance", "monitoring", "snowflake"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "mistapi>=0.64.0,<0.65",
    "snowflake-connector-python>=4.8.0,<5",
    "pandas>=3.0.6,<4",
    "numpy>=2.5.3,<3",
    "python-dotenv>=1.2.4,<2",
    "requests>=2.34.2,<3",
    "aiohttp>=3.14.3,<4",
    "python-dateutil>=2.9.0.post0,<3",
    "pytz>=2026.5",
    "colorlog>=6.12.0,<7",
    "pydantic>=2.13.5,<3",
    "dash>=4.4.1,<5",
    "plotly>=7.1.0,<8",
    "dash-bootstrap-components>=2.0.4,<3",
    "gunicorn>=26.2.0,<27",
    "redis>=8.1.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
    "mypy>=2.4.0,<3",
    "black>=26.10.0,<27",
    "isort>=9.0.2,<10",
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1,<3",
    "ruff>=0.16.10,<0.17",
    "vulture>=2.16,<3",
]

[project.scripts]
mistwan = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "data"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dash exposes dash_table components dynamically at runtime.
module = "dash.dash_table"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff.lint.per-file-ignores]
# Each worker, cache call, and Dash callback logs any failure and keeps the dashboard and the refresh loops running, as the code did before the gates.
"run_dashboard.py" = ["BLE001"]
"src/aggregators/time_aggregator.py" = ["BLE001"]
"src/api/async_mist_client.py" = ["BLE001"]
"src/api/mist_client.py" = ["BLE001"]
"src/cache/async_precompute.py" = ["BLE001"]
"src/cache/background_refresh.py" = ["BLE001"]
"src/cache/dashboard_precompute.py" = ["BLE001"]
"src/cache/redis_cache.py" = ["BLE001"]
"src/cache/site_precompute.py" = ["BLE001"]
"src/calculators/kpi_calculator.py" = ["BLE001"]
"src/collectors/quality_collector.py" = ["BLE001"]
"src/collectors/sle_collector.py" = ["BLE001"]
"src/collectors/status_collector.py" = ["BLE001"]
"src/collectors/utilization_collector.py" = ["BLE001"]
"src/dashboard/app.py" = ["BLE001"]
"src/dashboard/data_provider.py" = ["BLE001"]
"src/dashboard/pages/detail_data.py" = ["BLE001"]
"src/loaders/snowflake_loader.py" = ["BLE001"]
"src/main.py" = ["BLE001"]
