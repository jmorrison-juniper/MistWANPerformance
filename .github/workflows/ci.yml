name: CI

# One event starts one run. A push runs on main only, and a pull request runs once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt. Each check name starts with the job
  # ID, for example "gates / pytest (tests)".
  #
  # The mypy gate stays off, because it fails on the current code. mypy
  # reports 129 errors. Turn a gate on in the pull request that fixes its
  # findings.
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      python-version: '3.13'
      cache-dependency-path: requirements*.txt
      ruff: true
      black: true
      vulture: true
      pytest: true
      bandit: true
      pip-audit: true

  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      results: ${{ needs.gates.outputs.results }}
