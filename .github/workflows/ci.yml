name: CI

# One event starts one run. A push runs on main only, and a pull request runs once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt. Each check name starts with the job
  # ID, for example "gates / pytest (tests)".
  #
  # The shared workflow reports each gate result to the quality-gate issue
  # sync job below.
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      python-version: '3.13'
      cache-dependency-path: requirements*.txt
      ruff: true
      black: true
      vulture: true
      mypy: true
      pytest: true
      bandit: true
      pip-audit: true
      pip-audit-args: -r requirements-dev.txt

  containers:
    name: Offline container tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the supported runtime and test dependencies
        run: docker build --target tests -t mistwan-tests .
      - name: Run without network access
        run: docker run --rm --network none mistwan-tests
      - name: Validate Redis persistence configuration
        run: |
          docker run --rm --network none \
            -v "$PWD/redis.conf:/usr/local/etc/redis/redis.conf:ro" \
            redis:7.4.11-alpine sh -ec '
              redis-server /usr/local/etc/redis/redis.conf --daemonize yes
              redis-cli ping | grep -x PONG
              redis-cli CONFIG GET appendonly | grep -x yes
              redis-cli shutdown save
            '

  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      results: ${{ needs.gates.outputs.results }}
