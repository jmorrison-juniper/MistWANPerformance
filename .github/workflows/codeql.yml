name: CodeQL

# A pull request against any base runs the scan, so a required check always
# reports. A push runs on main only. The weekly schedule finds new queries
# against code that did not change. A manual run refreshes the scan on main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Each job names its own scopes. The empty map removes every other permission.
permissions: {}

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID, with the
  # category /language:python. Do not rename this file or this job.
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
